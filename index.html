<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Junior B Grammar Quiz</title>
<meta name="theme-color" content="#0052BF">
<meta name="robots" content="noindex, nofollow">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Grammar Quiz">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { height: 100%; }
  body {
    font-family: "Comic Sans MS", "Trebuchet MS", sans-serif;
    background: linear-gradient(135deg, #eaf1fb 0%, #ffffff 55%, #fdecd2 100%);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    align-items: safe center;
    justify-content: center;
    padding: 20px;
  }
  .card {
    background: #fff;
    border-radius: 24px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.2);
    width: 100%;
    max-width: 560px;
    padding: 32px;
    text-align: center;
    transition: max-width .2s;
    position: relative;
    margin: auto;
  }
  .card.menu-mode { max-width: 780px; }
  @media (max-width: 480px) {
    body { padding: 10px; }
    .card { padding: 20px 16px; }
    .brand-logo-top .dennislab-logo { height: 56px; }
    .dennislab-tagline { margin-bottom: 8px; }
    .dennislab-tagline .tagline-en { font-size: 0.7rem; }
    h1 { font-size: 1.5rem; }
    .subtitle { margin-bottom: 14px; }
  }
  .card.splash-mode .brand-logo-top,
  .card.splash-mode h1,
  .card.splash-mode .subtitle,
  .card.splash-mode .app-footer,
  .card.splash-mode .sound-toggle,
  .card.splash-mode .install-banner { display: none; }
  .install-banner {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    background: #eaf0fb;
    border: 2px solid #cddaf5;
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 16px;
    font-size: 0.8rem;
    color: #333;
    text-align: left;
  }
  .install-banner button {
    font-family: inherit;
    font-size: 0.78rem;
    font-weight: bold;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    padding: 6px 12px;
  }
  .install-banner .install-action { background: #0052BF; color: #fff; }
  .install-banner .install-dismiss { background: none; color: #999; padding: 6px 8px; }
  .sound-toggle {
    position: absolute;
    top: 14px;
    right: 14px;
    background: #eaf0fb;
    border: 2px solid #cddaf5;
    border-radius: 50%;
    width: 36px;
    height: 36px;
    font-size: 1.05rem;
    cursor: pointer;
    line-height: 1;
  }
  .sound-toggle:hover { background: #dde8fa; }
  .splash-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 0; }
  .splash-screen .dennislab-logo { height: 92px; width: auto; display: block; margin-bottom: 30px; }
  .splash-bar-outer { width: 220px; height: 10px; background: #eee; border-radius: 8px; overflow: hidden; }
  .splash-bar-inner {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg,#FE6D0F,#ffb066);
    border-radius: 8px;
    animation: splashLoad 1.7s ease-in-out forwards;
  }
  @keyframes splashLoad { from { width: 0%; } to { width: 100%; } }
  .brand-logo-top { margin-bottom: 4px; display: flex; justify-content: center; }
  .brand-logo-top .dennislab-logo { height: 76px; width: auto; display: block; }
  .dennislab-tagline { text-align: center; margin-bottom: 14px; }
  .dennislab-tagline .tagline-en { font-size: 0.78rem; font-weight: 700; color: #0052BF; letter-spacing: 0.3px; }
  .splash-screen .dennislab-tagline { margin-bottom: 26px; }
  .splash-screen .tagline-en { font-size: 0.95rem; }
  .app-footer {
    margin-top: 24px;
    padding-top: 14px;
    border-top: 1px solid #eee;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
  }
  .app-footer .footer-label { font-size: 0.75rem; color: #999; }
  .app-footer .galouzidou-logo a { display: inline-block; }
  .app-footer .galouzidou-logo svg { height: 24px; width: auto; display: block; }
  h1 { color: #0052BF; font-size: 1.8rem; margin-bottom: 6px; }
  .subtitle { color: #888; font-size: 0.95rem; margin-bottom: 20px; }
  .progress { color: #555; font-weight: bold; margin-bottom: 8px; }
  .bar { height: 12px; background: #eee; border-radius: 8px; overflow: hidden; margin-bottom: 24px; }
  .bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg,#0052BF,#FE6D0F); transition: width .4s; }
  .question {
    font-size: 1.35rem;
    color: #333;
    margin-bottom: 24px;
    line-height: 1.5;
    min-height: 60px;
  }
  .options { display: flex; flex-direction: column; gap: 14px; }
  .option {
    background: #eaf0fb;
    border: 3px solid #cddaf5;
    border-radius: 16px;
    padding: 16px;
    font-size: 1.15rem;
    cursor: pointer;
    transition: transform .1s, background .2s;
    font-family: inherit;
    color: #333;
  }
  .option:hover:not(:disabled) { transform: scale(1.03); background: #dde8fa; }
  .option:disabled { cursor: default; }
  .option.correct { background: #c8f7c5; border-color: #4caf50; }
  .option.wrong { background: #fbdad8; border-color: #e11e1f; }
  .feedback { margin-top: 22px; font-size: 1.2rem; font-weight: bold; min-height: 28px; }
  .feedback.good { color: #2e9e4f; }
  .feedback.bad { color: #e11e1f; }
  .next-btn {
    margin-top: 20px;
    background: #0052BF;
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 14px 32px;
    font-size: 1.1rem;
    cursor: pointer;
    font-family: inherit;
    display: none;
  }
  .next-btn:hover { background: #0a2566; }
  .result-emoji { font-size: 4rem; margin: 10px 0; }
  .score { font-size: 1.4rem; color: #333; margin-bottom: 20px; }
  .result-buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .menu-link {
    background: none;
    border: none;
    color: #1978a3;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 14px;
    font-size: 0.95rem;
    padding: 0;
    font-family: inherit;
  }
  .menu-link:hover { text-decoration: underline; }
  .levels-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 14px;
  }
  .level-card {
    background: #eaf0fb;
    border: 3px solid #cddaf5;
    border-radius: 16px;
    padding: 16px 10px;
    cursor: pointer;
    transition: transform .1s, background .2s;
    text-align: center;
  }
  .level-card:hover { transform: scale(1.04); background: #dde8fa; }
  .level-emoji { font-size: 2rem; margin-bottom: 6px; }
  .level-title { font-weight: bold; color: #333; font-size: 0.92rem; margin-bottom: 4px; }
  .level-topics { font-size: 0.66rem; color: #777; margin-bottom: 8px; line-height: 1.3; min-height: 2.4em; }
  .level-tier {
    display: inline-block;
    font-size: 0.68rem;
    font-weight: bold;
    color: #fff;
    border-radius: 10px;
    padding: 2px 10px;
    margin-bottom: 6px;
  }
  .level-best { font-size: 0.72rem; color: #777; }
  .level-stars { font-size: 0.95rem; letter-spacing: 1px; }
  .confetti-burst { position: absolute; top: 0; left: 0; width: 100%; height: 0; overflow: visible; pointer-events: none; }
  .confetti-piece { position: absolute; top: -10px; font-size: 1.3rem; animation: confettiFall ease-in forwards; }
  @keyframes confettiFall { to { transform: translateY(260px) rotate(360deg); opacity: 0; } }

  .mode-buttons { display: flex; flex-direction: column; gap: 16px; margin-top: 10px; }
  .mode-btn {
    background: #eaf0fb;
    border: 3px solid #cddaf5;
    border-radius: 18px;
    padding: 22px;
    cursor: pointer;
    font-family: inherit;
    text-align: center;
    transition: transform .1s, background .2s;
  }
  .mode-btn:hover { transform: scale(1.03); background: #dde8fa; }
  .mode-emoji { font-size: 2.4rem; margin-bottom: 8px; }
  .mode-title { font-size: 1.2rem; font-weight: bold; color: #333; }
  .mode-desc { font-size: 0.85rem; color: #777; margin-top: 4px; }

  .team-setup-row { display: flex; flex-direction: column; gap: 14px; margin: 18px 0; text-align: left; }
  .team-setup-row label { font-weight: bold; color: #555; font-size: 0.9rem; }
  .team-input {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    border: 3px solid #cddaf5;
    font-size: 1.05rem;
    font-family: inherit;
    margin-top: 6px;
  }
  .team-input:focus { outline: none; border-color: #0052BF; }
  .big-btn {
    background: #0052BF;
    color: #fff;
    border: none;
    border-radius: 14px;
    padding: 14px 32px;
    font-size: 1.1rem;
    cursor: pointer;
    font-family: inherit;
    margin-top: 10px;
  }
  .big-btn:hover { background: #0a2566; }

  .battle-scoreboard { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 10px; }
  .team-box {
    flex: 1;
    background: #eaf0fb;
    border-radius: 16px;
    padding: 12px 8px;
    border: 3px solid #cddaf5;
  }
  .team-box.active { border-color: #FE6D0F; background: #fff2e8; }
  .team-box .team-name { font-weight: bold; font-size: 0.85rem; color: #555; word-break: break-word; }
  .team-box .team-score { font-size: 1.8rem; font-weight: bold; color: #333; }
  .team-box.celebrate { animation: pulse .6s ease; }
  @keyframes pulse { 0% { transform: scale(1); } 30% { transform: scale(1.25); } 60% { transform: scale(0.95); } 100% { transform: scale(1); } }
  .turn-banner { font-size: 1.05rem; font-weight: bold; margin-bottom: 14px; padding: 10px; border-radius: 12px; }
  .timer-row { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; }
  .timer-row .timer-bar-outer { flex: 1; margin-bottom: 0; }
  .timer-seconds { font-size: 0.85rem; font-weight: bold; color: #555; min-width: 32px; text-align: right; }
  .timer-bar-outer { height: 10px; background: #eee; border-radius: 8px; overflow: hidden; }
  .timer-bar-inner { height: 100%; width: 100%; background: #43a047; transition: background-color .3s linear; }
</style>
</head>

<script>
const TIER_COLORS = { Easy: "#43a047", Medium: "#fb8c00", Hard: "#e11e1f", Challenge: "#8e24aa" };
const TIER_TIME = { Easy: 60, Medium: 45, Hard: 30, Challenge: 20 };
function timerColor(fraction) {
  if (fraction > 0.6) return "#43a047";
  if (fraction > 0.3) return "#FE6D0F";
  return "#E11E1F";
}
const TIER_META = [
  { tier: "Easy", emoji: "🟢", desc: "Warm up!", topics: "a/an • am/is/are • plurals • my/his/her/our/their • this/that/these/those" },
  { tier: "Medium", emoji: "🟠", desc: "Getting trickier", topics: "have got • there is/are • prepositions of place • can/can't • imperatives" },
  { tier: "Hard", emoji: "🔴", desc: "Real challenge", topics: "present simple • present continuous • simple vs continuous" },
  { tier: "Challenge", emoji: "🟣", desc: "Mix it all!", topics: "some/any • whose • possessive 's • object pronouns • much/many • mixed review" }
];
function pickRandomSet(tier) {
  const options = quizSets.filter(s => s.tier === tier);
  return options[Math.floor(Math.random() * options.length)];
}
function poolForTier(tier) {
  return quizSets.filter(s => s.tier === tier).flatMap(s => s.questions);
}
function getLastPlayed(tier) {
  try {
    const raw = localStorage.getItem("jbq_last_" + tier);
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return []; }
}
function saveLastPlayed(tier, qList) {
  try { localStorage.setItem("jbq_last_" + tier, JSON.stringify(qList)); } catch (e) {}
}
function pickQuestionsForTier(tier, count) {
  const pool = poolForTier(tier);
  const lastUsed = getLastPlayed(tier);
  let available = pool.filter(q => !lastUsed.includes(q.q));
  if (available.length < count) available = pool.slice();
  const chosen = shuffle(available).slice(0, count);
  saveLastPlayed(tier, chosen.map(q => q.q));
  return chosen;
}
function nextTierAfter(tier) {
  const idx = TIER_META.findIndex(t => t.tier === tier);
  return (idx >= 0 && idx < TIER_META.length - 1) ? TIER_META[idx + 1].tier : null;
}

const quizSets = [
  {
    id: 1, tier: "Easy", emoji: "🐣", title: "Level 1", topics: "a/an • am/is/are",
    questions: [
      { q: "I have got ___ orange in my bag.", options: ["a", "an"], answer: 1, why: "'orange' starts with a vowel sound, so we use <b>an</b>." },
      { q: "He has got ___ ball.", options: ["a", "an"], answer: 0, why: "'ball' starts with a consonant sound, so we use <b>a</b>." },
      { q: "I ___ nine years old.", options: ["am", "is", "are"], answer: 0, why: "We use <b>am</b> with I." },
      { q: "My mum ___ a teacher.", options: ["am", "is", "are"], answer: 1, why: "'My mum' = she → <b>is</b>." },
      { q: "We saw ___ owl in the garden last night.", options: ["a", "an"], answer: 1, why: "'owl' starts with a vowel sound, so we use <b>an</b>." },
      { q: "This ___ my new bike!", options: ["am", "is", "are"], answer: 1, why: "'This' = it → <b>is</b>." },
      { q: "You ___ very kind.", options: ["am", "is", "are"], answer: 2, why: "We use <b>are</b> with you." },
      { q: "It's ___ umbrella — take it with you!", options: ["a", "an"], answer: 1, why: "'umbrella' starts with a vowel sound, so we use <b>an</b>." }
    ]
  },
  {
    id: 2, tier: "Easy", emoji: "🐥", title: "Level 2", topics: "plurals • my/his/her/our/their",
    questions: [
      { q: "Look! Two ___ are running in the park.", options: ["dog", "dogs", "doges"], answer: 1, why: "Most nouns add <b>-s</b> to make the plural: dog → dogs." },
      { q: "There are three ___ on my desk.", options: ["watch", "watches", "watchs"], answer: 1, why: "Nouns ending in <b>-ch</b> add <b>-es</b>: watch → watches." },
      { q: "I can see six ___ swimming in the lake.", options: ["fish", "fishes", "fishs"], answer: 0, why: "'fish' is irregular — the plural stays the same: <b>fish</b>." },
      { q: "My uncle has got two ___.", options: ["foot", "feet", "foots"], answer: 1, why: "'foot' is irregular — the plural is <b>feet</b>." },
      { q: "I have got a cat. ___ cat is orange.", options: ["My", "Your", "Its"], answer: 0, why: "<b>My</b> goes with I." },
      { q: "This is Maria. ___ bag is pink.", options: ["His", "Her", "Their"], answer: 1, why: "'Maria' = she → <b>Her</b>." },
      { q: "We have got a new puppy. ___ puppy is very small.", options: ["Our", "Their", "Its"], answer: 0, why: "'We' → <b>Our</b>." },
      { q: "The boys have got a football. ___ football is old.", options: ["Their", "His", "Her"], answer: 0, why: "'The boys' = they → <b>Their</b>." }

      { q: "___ those your shoes over there?", options: ["Is", "Are"], answer: 1, why: "'those' is plural, so we use <b>Are</b>." },
      { q: "My sister has got a rabbit. ___ rabbit is white.", options: ["Her", "His", "Their"], answer: 0, why: "'My sister' = she → <b>Her</b>." },
      { q: "There are two ___ in the box.", options: ["toy", "toys", "toyes"], answer: 1, why: "Most nouns add <b>-s</b> to make the plural: toy → toys." },
      { q: "___ is my seat, and ___ is yours, over there.", options: ["This / that", "That / this"], answer: 0, why: "My seat is near me → <b>This</b>; yours is far away → <b>that</b>." },
      { q: "We ___ happy to see you!", options: ["am", "is", "are"], answer: 2, why: "'We' → <b>are</b>." },
      { q: "The children have got new pencils. ___ pencils are colourful.", options: ["Their", "Our", "Your"], answer: 0, why: "'The children' = they → <b>Their</b>." },
      { q: "Look! ___ elephant is drinking water.", options: ["A", "An"], answer: 1, why: "'elephant' starts with a vowel sound, so we use <b>An</b>." }

  {
    id: 5, tier: "Medium", emoji: "🚀", title: "Level 5", topics: "have got • there is/are • prepositions • can/can't • imperatives",
    questions: [
      { q: "I ___ a big blue schoolbag.", options: ["have got", "has got"], answer: 0, why: "We use <b>have got</b> with I, you, we, they." },
      { q: "___ a cat under the table.", options: ["There is", "There are"], answer: 0, why: "One thing (a cat) → <b>There is</b>." },

/* ---------- Audio feedback (no external files needed) ---------- */
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  }
  return audioCtx;
}
function unlockAudio() {
  const ctx = getAudioCtx();
  if (!ctx) return;
  if (ctx.state === "suspended") { ctx.resume().catch(() => {}); }
  try {
    const buffer = ctx.createBuffer(1, 1, 22050);
    const source = ctx.createBufferSource();
    source.buffer = buffer;
    source.connect(ctx.destination);
    source.start(0);
  } catch (e) {}
}
document.addEventListener("touchstart", unlockAudio, { once: true, passive: true });
document.addEventListener("click", unlockAudio, { once: true });
function beep(freq, duration, type) {
  if (!soundOn) return;
  const ctx = getAudioCtx();
  if (!ctx) return;
  if (ctx.state === "suspended") { ctx.resume().catch(() => {}); }
  try {
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || "sine";
    osc.frequency.value = freq;
    osc.connect(gain);
    gain.connect(ctx.destination);
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.stop(ctx.currentTime + duration);
  } catch (e) {}
}
function beepCorrect() { beep(880, 0.18, "sine"); setTimeout(() => beep(1318, 0.22, "sine"), 120); }
function beepWrong() { beep(180, 0.35, "sawtooth"); }

        <div class="mode-desc">Two teams take turns answering. Most points wins!</div>
      </button>

  `;

}

let soundOn = true;
try {

} catch (e) {}

}

}
function beepTick() { beep(660, 0.1, "square"); }
function beepCelebrate() {
  beep(660, 0.14, "sine");
  setTimeout(() => beep(880, 0.14, "sine"), 130);
  setTimeout(() => beep(1108, 0.22, "sine"), 260);
}

/* ---------- Shuffling ---------- */
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function prepareQuestions(questions) {
  return shuffle(questions).map(q => {
    const order = shuffle(q.options.map((_, i) => i));
    return {
      q: q.q,
      why: q.why,
      options: order.map(i => q.options[i]),
      answer: order.indexOf(q.answer)
    };
  });
}

/* ---------- Solo practice ---------- */
let activeSet = null;
let currentQuestions = [];
let missedQuestions = [];
let practiceMode = false;
let current = 0;
let score = 0;
let questionAnswered = false;
let soloTimer = null;
let soloTimeLeft = 0;
let progressEl, barFill, questionEl, optionsEl, feedbackEl, nextBtn, soloTimerBarEl, soloTimerTextEl;

function getBest(tier) {
  try {
    const raw = localStorage.getItem("jbq_best_" + tier);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}
function saveBest(tier, sc, total) {
  try {
    const cur = getBest(tier);
    if (!cur || sc > cur.score) {
      localStorage.setItem("jbq_best_" + tier, JSON.stringify({ score: sc, total: total }));
    }
  } catch (e) {}
}
function starsFor(sc, total) {
  if (sc >= total) return 3;
  if (sc >= Math.ceil(total * 0.75)) return 2;
  if (sc >= Math.ceil(total * 0.5)) return 1;
  return 0;
}
function starsDisplay(tier) {
  const best = getBest(tier);
  if (!best) return "———";
  const s = starsFor(best.score, best.total);
  if (s === 0) return "🔄 Try again";
  return "⭐".repeat(s) + "☆".repeat(3 - s);
}

function resetProgress() {
  if (!confirm("Reset all your stars and start over from zero?")) return;
  TIER_META.forEach(t => {
    try {
      localStorage.removeItem("jbq_best_" + t.tier);
      localStorage.removeItem("jbq_last_" + t.tier);
    } catch (e) {}
  });
  renderMenu();
}

function renderMenu() {
  subtitleEl.innerHTML = "Junior B &nbsp;•&nbsp; Pick a difficulty — we'll surprise you with a set!";
  let html = `<button class="menu-link" onclick="renderModeSelect()">⬅ Home</button>
    <button class="menu-link" style="float:right;color:#999" onclick="resetProgress()">🔄 Reset progress</button>
    <div class="levels-grid">`;
  TIER_META.forEach(t => {
    html += `<div class="level-card" onclick="startRandomSet('${t.tier}')">
      <div class="level-emoji">${t.emoji}</div>
      <div class="level-title">${t.tier}</div>
      <div class="level-tier" style="background:${TIER_COLORS[t.tier]}">${t.desc}</div>
      <div class="level-topics">${t.topics}</div>
      <div class="level-stars">${starsDisplay(t.tier)}</div>
    </div>`;
  });
  html += `</div>`;
  menuEl.innerHTML = html;
  setScreen("menu");
}

function buildGameShell() {
  gameEl.innerHTML = `
    <button class="menu-link" id="menuBtn">⬅ Back to levels</button>
    <div class="progress" id="progress"></div>
    <div class="bar"><div class="bar-fill" id="barFill"></div></div>
    <div class="timer-row">
      <div class="timer-bar-outer"><div class="timer-bar-inner" id="soloTimerBar"></div></div>
      <span class="timer-seconds" id="soloTimerText"></span>
    </div>
    <div class="question" id="question"></div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="nextBtn">Next ➜</button>
  `;
  progressEl = document.getElementById("progress");
  barFill = document.getElementById("barFill");
  soloTimerBarEl = document.getElementById("soloTimerBar");
  soloTimerTextEl = document.getElementById("soloTimerText");
  questionEl = document.getElementById("question");
  optionsEl = document.getElementById("options");
  feedbackEl = document.getElementById("feedback");
  nextBtn = document.getElementById("nextBtn");
  document.getElementById("menuBtn").onclick = () => { clearInterval(soloTimer); renderMenu(); };
  nextBtn.onclick = handleNext;
}

function startSoloTimer() {
  clearInterval(soloTimer);
  const limit = TIER_TIME[activeSet.tier] || 45;
  soloTimeLeft = limit;
  soloTimerBarEl.style.transition = "none";
  soloTimerBarEl.style.width = "100%";
  soloTimerBarEl.style.background = timerColor(1);
  soloTimerTextEl.textContent = soloTimeLeft + "s";
  requestAnimationFrame(() => { soloTimerBarEl.style.transition = "width 1s linear, background-color .3s linear"; });
  soloTimer = setInterval(() => {
    soloTimeLeft--;
    const fraction = Math.max(0, soloTimeLeft / limit);
    soloTimerBarEl.style.width = (fraction * 100) + "%";
    soloTimerBarEl.style.background = timerColor(fraction);
    soloTimerTextEl.textContent = Math.max(0, soloTimeLeft) + "s";
    if (soloTimeLeft > 0 && soloTimeLeft <= 3) beepTick();
    if (soloTimeLeft <= 0) {
      clearInterval(soloTimer);
      if (!questionAnswered) choose(-1, null);
    }
  }, 1000);
}

function startRandomSet(tier) {
  const meta = TIER_META.find(t => t.tier === tier);
  activeSet = { tier: tier, title: tier, emoji: meta.emoji };
  practiceMode = false;
  currentQuestions = prepareQuestions(pickQuestionsForTier(tier, 8));
  missedQuestions = [];
  current = 0;
  score = 0;
  subtitleEl.innerHTML = `${meta.emoji} <b>${tier}</b>`;
  setScreen("game");
  buildGameShell();
  showQuestion();
}

function startMistakePractice() {
  if (!missedQuestions.length) return;
  currentQuestions = prepareQuestions(missedQuestions);
  missedQuestions = [];
  practiceMode = true;
  current = 0;
  score = 0;
  subtitleEl.innerHTML = `🔄 <b>Mistakes Practice</b> &nbsp;•&nbsp; ${activeSet.title}`;
  setScreen("game");
  buildGameShell();
  showQuestion();
}

function showQuestion() {
  const item = currentQuestions[current];
  const total = currentQuestions.length;
  progressEl.textContent = `Question ${current + 1} of ${total}`;
  barFill.style.width = ((current) / total * 100) + "%";
  questionEl.textContent = item.q;
  feedbackEl.textContent = "";
  feedbackEl.className = "feedback";
  nextBtn.style.display = "none";
  optionsEl.innerHTML = "";
  questionAnswered = false;

  item.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option";
    btn.textContent = opt;
    btn.onclick = () => choose(i, btn);
    optionsEl.appendChild(btn);
  });

  startSoloTimer();
}

function choose(i, btn) {
  if (questionAnswered) return;
  questionAnswered = true;
  clearInterval(soloTimer);

  const item = currentQuestions[current];
  const total = currentQuestions.length;
  const buttons = optionsEl.querySelectorAll(".option");
  buttons.forEach(b => b.disabled = true);

  if (i === item.answer) {
    btn.classList.add("correct");
    feedbackEl.textContent = "✅ Well done! That's correct!";
    feedbackEl.className = "feedback good";
    score++;
    beepCorrect();
  } else {
    if (btn) btn.classList.add("wrong");
    buttons[item.answer].classList.add("correct");
    const prefix = (i === -1) ? "⏰ Time's up! " : "❌ Oops! ";
    feedbackEl.innerHTML = prefix + "The right answer is <b>" +
      item.options[item.answer] + "</b>.<br><span style='font-weight:normal;font-size:1rem;color:#555'>" +
      item.why + "</span>";
    feedbackEl.className = "feedback bad";
    missedQuestions.push(item);
    beepWrong();
  }

  barFill.style.width = ((current + 1) / total * 100) + "%";
  nextBtn.textContent = current === total - 1 ? "See my score 🎉" : "Next ➜";
  nextBtn.style.display = "inline-block";
}

function handleNext() {
  current++;
  if (current < currentQuestions.length) {
    showQuestion();
  } else {
    showResult();
  }
}

function buildConfetti() {
  const emojis = ["🎉", "⭐", "✨", "🎊"];
  let html = "";
  for (let k = 0; k < 20; k++) {
    const left = (Math.random() * 100).toFixed(1);
    const delay = (Math.random() * 0.5).toFixed(2);
    const dur = (1.4 + Math.random() * 0.9).toFixed(2);
    const emoji = emojis[Math.floor(Math.random() * emojis.length)];
    html += `<span class="confetti-piece" style="left:${left}%;animation-delay:${delay}s;animation-duration:${dur}s;">${emoji}</span>`;
  }
  return html;
}

function showResult() {
  const total = currentQuestions.length;
  const stars = starsFor(score, total);
  let emoji, msg;
  const pct = score / total;
  if (pct === 1)       { emoji = "🏆"; msg = "Perfect! You are a grammar star!"; }
  else if (pct >= 0.7) { emoji = "😃"; msg = "Great job! Keep it up!"; }
  else if (pct >= 0.5) { emoji = "🙂"; msg = "Good try! A little more practice!"; }
  else                 { emoji = "💪"; msg = "Don't worry, let's practise again!"; }

  if (!practiceMode) saveBest(activeSet.tier, score, total);
  if (stars === 3) beepCelebrate();

  const starsRow = "⭐".repeat(stars) + "☆".repeat(3 - stars);
  const mistakesBtn = missedQuestions.length
    ? `<button class="next-btn" style="display:inline-block;background:#FE6D0F" onclick="startMistakePractice()">🔄 Practise my mistakes</button>`
    : "";
  const nextTier = nextTierAfter(activeSet.tier);
  const nextTierBtn = (!practiceMode && nextTier)
    ? `<button class="next-btn" style="display:inline-block;background:#43a047" onclick="startRandomSet('${nextTier}')">➡️ Next level (${nextTier})</button>`
    : "";
  const confetti = stars === 3 ? `<div class="confetti-burst">${buildConfetti()}</div>` : "";

  gameEl.innerHTML = `
    ${confetti}
    <div class="result-emoji">${emoji}</div>
    <div class="score">You got <b>${score}</b> out of <b>${total}</b>! &nbsp; <span style="letter-spacing:2px">${starsRow}</span></div>
    <p style="color:#555;margin-bottom:20px;">${msg}</p>
    <div class="result-buttons">
      ${mistakesBtn}
      <button class="next-btn" style="display:inline-block" onclick="startRandomSet('${activeSet.tier}')">▶️ Play again</button>
      ${nextTierBtn}
      <button class="next-btn" style="display:inline-block;background:#1978a3" onclick="renderMenu()">🏠 Levels</button>
    </div>
  `;
}

/* ---------- Team Battle ---------- */
let battleSet = null;
let battleCurrent = 0;
let battleScores = { A: 0, B: 0 };
let battleNames = { A: "Team A", B: "Team B" };
let battleTimer = null;
let battleTimeLeft = 15;
let battleTimeLimit = 30;
let battleAnswered = false;
let currentTurn = "A";
let teamNameAEl, teamScoreAEl, teamNameBEl, teamScoreBEl, teamBoxAEl, teamBoxBEl,
    turnBannerEl, battleTimerBarEl, battleTimerTextEl, battleQuestionEl, battleOptionsEl, battleFeedbackEl;

function renderBattleSetup() {
  subtitleEl.innerHTML = "⚔️ &nbsp;Team Battle &nbsp;•&nbsp; Who's playing?";
  battleSetupEl.innerHTML = `
    <button class="menu-link" onclick="renderModeSelect()">⬅ Home</button>

}

function confirmBattleTeams() {
  const a = document.getElementById("teamAInput").value.trim();
  const b = document.getElementById("teamBInput").value.trim();

  battleNames.B = b || "Team B";

function startRandomBattle(tier) {

}

function renderBattleMenu() {

  let html = `<button class="menu-link" onclick="renderBattleSetup()">⬅ Change team names</button><div class="levels-grid">`;

    </div>`;
  });

  battleMenuEl.innerHTML = html;

}

function buildBattleShell() {
  battleGameEl.innerHTML = `
    <button class="menu-link" id="battleMenuBtn">⬅ Change level</button>
    <div class="battle-scoreboard">
      <div class="team-box" id="teamBoxA">
        <div class="team-name" id="teamNameA"></div>
        <div class="team-score" id="teamScoreA">0</div>
      </div>
      <div class="team-box" id="teamBoxB">
        <div class="team-name" id="teamNameB"></div>
        <div class="team-score" id="teamScoreB">0</div>
      </div>
    </div>
    <div class="turn-banner" id="turnBanner"></div>
    <div class="timer-row">
      <div class="timer-bar-outer"><div class="timer-bar-inner" id="battleTimerBar"></div></div>
      <span class="timer-seconds" id="battleTimerText"></span>
    </div>
    <div class="question" id="battleQuestion"></div>
    <div class="options" id="battleOptions"></div>
    <div class="feedback" id="battleFeedback"></div>
  `;
  teamNameAEl = document.getElementById("teamNameA");
  teamScoreAEl = document.getElementById("teamScoreA");
  teamNameBEl = document.getElementById("teamNameB");
  teamScoreBEl = document.getElementById("teamScoreB");
  teamBoxAEl = document.getElementById("teamBoxA");
  teamBoxBEl = document.getElementById("teamBoxB");
  turnBannerEl = document.getElementById("turnBanner");
  battleTimerBarEl = document.getElementById("battleTimerBar");
  battleTimerTextEl = document.getElementById("battleTimerText");
  battleQuestionEl = document.getElementById("battleQuestion");
  battleOptionsEl = document.getElementById("battleOptions");
  battleFeedbackEl = document.getElementById("battleFeedback");

  document.getElementById("battleMenuBtn").onclick = () => { clearInterval(battleTimer); renderBattleMenu(); };
  teamNameAEl.textContent = "🔵 " + battleNames.A;
  teamNameBEl.textContent = "🔴 " + battleNames.B;
  teamScoreAEl.textContent = "0";
  teamScoreBEl.textContent = "0";
}

function startBattle(id) {
  battleSet = quizSets.find(s => s.id === id);
  battleCurrent = 0;
  battleScores = { A: 0, B: 0 };
  subtitleEl.innerHTML = `⚔️ ${battleSet.emoji} <b>${battleSet.title}</b> &nbsp;•&nbsp; ${battleSet.tier}`;
  setScreen("battleGame");
  buildBattleShell();
  battleShowQuestion();
}

function battleShowQuestion() {
  if (battleCurrent >= battleSet.questions.length) {
    battleShowResult();
    return;
  }
  const item = battleSet.questions[battleCurrent];
  currentTurn = (battleCurrent % 2 === 0) ? "A" : "B";

  teamBoxAEl.classList.toggle("active", currentTurn === "A");
  teamBoxBEl.classList.toggle("active", currentTurn === "B");
  turnBannerEl.textContent = `${currentTurn === "A" ? "🔵" : "🔴"} ${battleNames[currentTurn]}'s turn — Question ${battleCurrent + 1} of ${battleSet.questions.length}`;
  turnBannerEl.style.background = currentTurn === "A" ? "#e7edfa" : "#fdeceb";
  turnBannerEl.style.color = currentTurn === "A" ? "#0052BF" : "#E11E1F";

  battleQuestionEl.textContent = item.q;
  battleFeedbackEl.textContent = "";
  battleFeedbackEl.className = "feedback";
  battleOptionsEl.innerHTML = "";
  battleAnswered = false;

  item.options.forEach((opt, i) => {
    const btn = document.createElement("button");
    btn.className = "option";
    btn.textContent = opt;
    btn.onclick = () => battleChoose(i, btn);
    battleOptionsEl.appendChild(btn);
  });

  startBattleTimer();
}

function startBattleTimer() {
  clearInterval(battleTimer);
  battleTimeLimit = TIER_TIME[battleSet.tier] || 30;
  battleTimeLeft = battleTimeLimit;
  battleTimerBarEl.style.transition = "none";
  battleTimerBarEl.style.width = "100%";
  battleTimerBarEl.style.background = timerColor(1);
  battleTimerTextEl.textContent = battleTimeLeft + "s";
  requestAnimationFrame(() => { battleTimerBarEl.style.transition = "width 1s linear, background-color .3s linear"; });
  battleTimer = setInterval(() => {
    battleTimeLeft--;
    const fraction = Math.max(0, battleTimeLeft / battleTimeLimit);
    battleTimerBarEl.style.width = (fraction * 100) + "%";
    battleTimerBarEl.style.background = timerColor(fraction);
    battleTimerTextEl.textContent = Math.max(0, battleTimeLeft) + "s";
    if (battleTimeLeft > 0 && battleTimeLeft <= 3) beepTick();
    if (battleTimeLeft <= 0) {
      clearInterval(battleTimer);
      if (!battleAnswered) battleChoose(-1, null);
    }
  }, 1000);
}

function battleChoose(i, btn) {
  if (battleAnswered) return;
  battleAnswered = true;
  clearInterval(battleTimer);
  const item = battleSet.questions[battleCurrent];
  const buttons = battleOptionsEl.querySelectorAll(".option");
  buttons.forEach(b => b.disabled = true);
  const turn = currentTurn;
  const correct = i === item.answer;

  if (correct) {
    battleScores[turn]++;
    if (turn === "A") {
      teamScoreAEl.textContent = battleScores.A;
      teamBoxAEl.classList.add("celebrate");
      setTimeout(() => teamBoxAEl.classList.remove("celebrate"), 650);
    } else {
      teamScoreBEl.textContent = battleScores.B;
      teamBoxBEl.classList.add("celebrate");
      setTimeout(() => teamBoxBEl.classList.remove("celebrate"), 650);
    }
    if (btn) btn.classList.add("correct");
    battleFeedbackEl.textContent = `✅ Correct! ${battleNames[turn]} +1 point!`;
    battleFeedbackEl.className = "feedback good";
    beepCorrect();
  } else {
    if (btn) btn.classList.add("wrong");
    buttons[item.answer].classList.add("correct");
    const prefix = (i === -1) ? "⏰ Time's up! " : "❌ Not quite! ";
    battleFeedbackEl.innerHTML = prefix + "The right answer is <b>" +
      item.options[item.answer] + "</b>.<br><span style='font-weight:normal;font-size:1rem;color:#555'>" +
      item.why + "</span>";
    battleFeedbackEl.className = "feedback bad";
    beepWrong();
  }

  setTimeout(() => {
    battleCurrent++;
    battleShowQuestion();
  }, 1900);
}

function battleShowResult() {
  let winner = null, emoji;
  if (battleScores.A > battleScores.B) { winner = battleNames.A; emoji = "🏆"; }
  else if (battleScores.B > battleScores.A) { winner = battleNames.B; emoji = "🏆"; }
  else { emoji = "🤝"; }
  const title = winner ? `${emoji} ${winner} wins!` : `${emoji} It's a tie!`;

  battleGameEl.innerHTML = `
    <div class="result-emoji">${emoji}</div>
    <div class="score">${title}</div>
    <p style="color:#555;margin-bottom:6px;">🔵 ${battleNames.A}: <b>${battleScores.A}</b> &nbsp;—&nbsp; 🔴 ${battleNames.B}: <b>${battleScores.B}</b></p>
    <p style="color:#888;margin-bottom:20px;font-size:0.9rem;">Great teamwork, everyone!</p>
    <div class="result-buttons">
      <button class="next-btn" style="display:inline-block" onclick="startRandomBattle('${battleSet.tier}')">Play again 🔁</button>
      <button class="next-btn" style="display:inline-block;background:#1978a3" onclick="renderBattleMenu()">⬅ Another level</button>
      <button class="next-btn" style="display:inline-block;background:#666" onclick="renderModeSelect()">🏠 Home</button>
    </div>
  `;
}

/* ---------- Install prompt ---------- */
let deferredInstallPrompt = null;
const isIOSDevice = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
let installBannerDismissed = false;
try { localStorage.removeItem("jbq_install_dismissed"); } catch (e) {}

function isRunningStandalone() {
  return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
}

function maybeShowInstallBanner() {
  const banner = document.getElementById("installBanner");
  if (!banner || installBannerDismissed || isRunningStandalone()) return;
  if (!deferredInstallPrompt && !isIOSDevice) return;
  const text = document.getElementById("installText");
  const actionBtn = document.getElementById("installActionBtn");
  if (deferredInstallPrompt) {
    text.textContent = "📲 Install this app for quick, full-screen access!";
    actionBtn.style.display = "inline-block";
  } else {
    text.textContent = "📲 Add to your Home Screen: tap Share ⬆️, then \"Add to Home Screen\".";
    actionBtn.style.display = "none";
  }
  banner.style.display = "flex";
}

async function handleInstallClick() {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  hideInstallBanner();
}

function dismissInstallBanner() {
  installBannerDismissed = true;
  hideInstallBanner();
}

function hideInstallBanner() {
  const banner = document.getElementById("installBanner");
  if (banner) banner.style.display = "none";
}

window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  installBannerDismissed = false;
  maybeShowInstallBanner();
});
window.addEventListener("appinstalled", hideInstallBanner);

updateSoundToggleUI();
renderSplash();

if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
